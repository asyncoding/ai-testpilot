# ios-local-poc：日常开发与主演示 profile（docs/01 §9）
# S1.2 起 model=ollama、vectors=chroma、search=hybrid（真实嵌入+混合检索）；
# runner 仍为 recorded（S3 起 xcode）、environment 仍 stub（S3 起 ios-simulator）。
profile: ios-local-poc

project:
  name: AlarmKitSpike
  # 真实被测仓在另一个仓库（docs/03），不拷贝进本仓；路径走环境变量覆盖，禁止写死：
  #   export TESTPILOT_REPO_PATH=~/Documents/Code/app-calendar-alarm
  repo_path: ../../app-calendar-alarm
  default_branch: alarmkit-spike
  tech_stack: ios
  ios:
    workspace: AlarmKitSpike/AlarmKitSpike.xcworkspace
    scheme: AlarmKitSpike
    simulator_udid: 5411787C-8AFF-4EBF-9000-EB5EFD1457D5

paths:
  data_dir: store/ios-local-poc
  fixtures_dir: tests/fixtures

external_write_enabled: false

adapters:
  # S1.3：真实 git CLI 适配器（ChangeSet/HEAD live-verify）。纯懒构造，
  # 装配不起 git 进程；超时/坏仓 → AdapterUnavailableError，调用侧降级不抛穿。
  scm:
    type: git
    settings:
      timeout_s: 15
  docs:
    type: fs-docs
    settings:
      roots:
        - ${REPO_PATH}            # 事故复盘/PRD/技术方案等 Markdown（配合 excludes）
      # 仅当前产品 AlarmKitSpike（workspace 实际编译的 target）。
      # 仓库根 Package.swift(名=CalendarStrongReminder)/顶层 Sources/ 是 2026-08 已作废的
      # 旧 SPM 包（EventDetailView/CalendarStrongReminderApp 等），workspace 不引用它，
      # 禁止纳入 code_roots——否则代码类问题全部召回作废 App（2026-11-03 实测踩坑，见
      # .agent-handoff/2026-11-03-s1-knowledge-qa.md §S1.1.1）。
      # Tests/UITests 暂不纳入，留到 S2/S3 测试相关阶段。
      code_roots:
        - ${REPO_PATH}/AlarmKitSpike/Sources
        - ${REPO_PATH}/AlarmKitSpike/Shared
        - ${REPO_PATH}/AlarmKitSpike/WidgetExtension
      excludes:
        - "**/node_modules/**"
        - "**/build/**"
        - "**/Pods/**"
        - "**/.git/**"
        - "**/.agent-handoff/**"
        - "**/icon-drafts/**"
        - "**/*.bak"
        - "**/CLAUDE.md"
        - "**/AGENT.md"
        - "**/小红书文案.md"
        # 2026-08 作废工程/转型前方案文档（头部均署名 CalendarStrongReminder），
        # 当前权威是 docs/V1需求|技术设计|测试用例文档（2026-10，AlarmKitSpike V1.2）。
        - "docs/功能设计文档.md"
        - "docs/功能细化设计文档.md"
        - "docs/技术方案文档.md"
        - "docs/项目计划文档.md"
        - "docs/日历闹钟-本地通知版.md"
        - "docs/日历闹钟-快捷指令版.md"
        # 仓根 PRD/TECHNICAL-PLAN 是 2026-08-26 转型前 V1（Calendar Strong Reminder），
        # 已被 docs/V1* 取代；根 README 描述旧 SPM 布局，一并排除。
        - "PRD.md"
        - "TECHNICAL-PLAN.md"
        - "README.md"
        # 噪音：0 字节空文件、与产品无关的 meta 文案
        - "2026-09-15.md"
        - "Claude code vs 其他Agent的优势.md"
      authority_overrides:
        # docs/V1* 三件套与 AlarmKitSpike-* 复盘经 docs/** 自动获得 L1；
        # 已排除的根 PRD.md/TECHNICAL-PLAN.md 不再给权威权重。
        - {glob: "docs/**", level: L1_authoritative}
        - {glob: "Resources/**", level: L1_authoritative}
  cases:      {type: stub}
  tickets:    {type: json}
  ci_events:  {type: json-replay}
  runner:     {type: recorded}   # S3: xcode
  environment: {type: stub}
  artifact:   {type: localfs}
  logs:       {type: stub}
  # S1.2 混合检索：BM25(trigram) + dmeta 向量 RRF 融合。
  # 起服务：docker compose -f deploy/docker-compose.yml up -d chroma；ollama serve。
  # 向量通道运行期故障会自动降级 FTS-only 并在 retrieval_events 留痕（非装配错误）。
  search:
    type: hybrid
    settings:
      channel_top_k: 20
      rrf_k: 60
      quality_power: 1.0
      half_life_days: null       # 语料 mtime 集中在近期同批，先不启用新鲜度衰减
  model:
    type: ollama                 # 地址可用 TESTPILOT_OLLAMA_URL 覆盖
    settings:
      base_url: http://localhost:11434
      chat_model: qwen2.5:7b
      embed_model: shaw/dmeta-embedding-zh   # ~200MB；拉取失败退 bge-m3
      timeout: 60
      # Ollama 默认空闲 5m 卸载模型，冷加载实测 55.3s；常驻窗口拉到 30m
      keep_alive: 30m
  vectors:
    type: chroma                 # 地址可用 TESTPILOT_CHROMA_URL 覆盖
    settings:
      base_url: http://localhost:8000
      collection: alarmkitspike-chunks
      timeout: 30
  queue:      {type: sqlite}     # S3: redis+arq
  tracer:     {type: noop}       # compose observability profile 起来后可切 langfuse
