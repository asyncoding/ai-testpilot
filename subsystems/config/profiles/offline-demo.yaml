# offline-demo：无网/无 Xcode 完整演示（docs/07 §9）
# 页面/输出须标注"证据来自录制夹具"。路径相对 subsystems/ 解析。
profile: offline-demo

project:
  name: AlarmKitSpike-demo
  # 离线模式的"仓库"就是夹具目录本身：fixtures/docs 下的文档能经录制 scm
  # 真实重切块做 live-verify（path_map 映射），无需外部仓存在。
  repo_path: tests/fixtures
  default_branch: alarmkit-spike
  tech_stack: ios
  ios:
    workspace: AlarmKitSpike.xcworkspace
    scheme: AlarmKitSpike
    simulator_udid: recorded

paths:
  data_dir: store/offline-demo
  fixtures_dir: tests/fixtures

external_write_enabled: false  # 默认 dry-run：R2/R3 只进 outbox 不写外部（docs/08 FR-WR-003）

limits:
  max_agent_steps: 12
  max_tokens_per_run: 200000
  daily_rerun_quota: 20
  request_timeout_s: 60

adapters:
  # S1.3：录制型 git（tests/fixtures/git，固定 author/date 的确定性演示仓）。
  # path_map 把 live-verify 反推出的 git 相对路径映射到当前夹具文档
  # （相对 tests/fixtures/git 解析，../ 出到 tests/fixtures/docs）。
  scm:
    type: recorded
    settings:
      fixtures_dir: git
      path_map:
        docs/kill-backup.md: ../docs/kill-backup.md
        docs/sidebar-fallback.md: ../docs/sidebar-fallback.md
  docs:
    type: fs-docs
    settings:
      roots: [tests/fixtures/docs]
      # S1.4：fs-docs 默认把 markdown 标 L2_experience；事故双段装配要求「历史证词
      # 文档」与「模型当前引用文档」不交叉。kill-backup.md 是当前规范（L1），
      # sidebar-fallback.md 保留默认 L2 作历史证词，glob 命中 alias/rel 形态。
      authority_overrides:
        - glob: "docs/kill-backup.md"
          level: L1_authoritative
  cases:                          # S2.1 FR-CON-003：用例 Markdown 连接器
    type: fs-cases
    settings:
      roots: [tests/fixtures/cases]
  tickets:
    type: json
    settings: {}
  ci_events:
    type: json-replay
    settings: {}
  runner:
    type: recorded
    settings: {}
  environment: {type: stub}        # S3: ios-simulator
  artifact:
    type: localfs
    settings: {}
  logs:       {type: stub}          # S3: oslog
  search:
    type: sqlite-fts
    settings: {}
  model:
    type: recorded
    settings: {}
  vectors:
    type: stub                   # 离线 profile：不起 Chroma，检索保持 FTS-only
    settings: {}
  queue:
    type: sqlite
    settings: {}
  tracer:
    type: noop
    settings: {}
