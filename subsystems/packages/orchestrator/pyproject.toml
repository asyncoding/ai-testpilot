[project]
name = "testpilot-orchestrator"
version = "0.1.0"
description = "TestPilot 编排：FastAPI + LangGraph 三工作流（S0 骨架）"
requires-python = ">=3.12"
dependencies = [
    "testpilot-core",
    "testpilot-adapters",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # S1.4 问答工作流编排（docs/07 §11 指定）：StateGraph + SQLite checkpointer。
    # 框架隔离在 qa_graph/graph.py 单文件；节点函数与 LangGraph 无关，若 3.14 兼容
    # 出问题可换手写状态机而节点零改动。
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.optional-dependencies]
langfuse = ["langfuse>=5.0"]  # v5 OTel API；LangfuseTracer 不兼容旧 v2 SDK

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_orchestrator"]
