[project]
name = "testpilot-orchestrator"
version = "0.1.0"
description = "TestPilot 编排：FastAPI + LangGraph 三工作流（S0 骨架）"
requires-python = ">=3.12"
dependencies = [
    "testpilot-core",
    "testpilot-adapters",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
langfuse = ["langfuse>=5.0"]  # v5 OTel API；LangfuseTracer 不兼容旧 v2 SDK

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_orchestrator"]
