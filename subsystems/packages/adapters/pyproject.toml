[project]
name = "testpilot-adapters"
version = "0.1.0"
description = "TestPilot 适配器：文件/Git/JSON/xcodebuild/SQLite/录制型离线适配器"
requires-python = ">=3.12"
dependencies = [
    "testpilot-core",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    # Ollama / Chroma REST 直连（S1.2）；不引 chromadb SDK，避免 numpy 重依赖
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_adapters"]
