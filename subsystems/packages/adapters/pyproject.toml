[project]
name = "testpilot-adapters"
version = "0.1.0"
description = "TestPilot 适配器：文件/Git/JSON/xcodebuild/SQLite/录制型离线适配器"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "testpilot-core",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    # Ollama / Chroma REST 直连（S1.2）；不引 chromadb SDK，避免 numpy 重依赖
    "httpx>=0.27",
]

# E6 FR-ING-002 AC3 选型复核：tree-sitter 仅作可选切块器，不进默认依赖
# （core 零三方红线不动；缺包时 TreeSwiftChunker 构造抛 AdapterUnavailableError）。
# 安装：uv pip install -e 'packages/adapters[tree-sitter]'
[project.optional-dependencies]
tree-sitter = [
    "tree-sitter>=0.23",
    "tree-sitter-swift>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_adapters"]
