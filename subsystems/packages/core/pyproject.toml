[project]
name = "testpilot-core"
version = "0.1.0"
description = "TestPilot 核心：统一领域模型、端口接口、策略（无 IO、无外部 SDK）"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_core"]
