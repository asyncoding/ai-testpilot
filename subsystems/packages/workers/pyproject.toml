[project]
name = "testpilot-workers"
version = "0.1.0"
description = "TestPilot workers：ingest / runner / eval（独立进程，S0 骨架）"
requires-python = ">=3.12"
dependencies = [
    "testpilot-core",
    "testpilot-adapters",
    "testpilot-orchestrator",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    # WS 闸门驱动（ws_gate_driver.WebsocketsConnection）的真实传输栈；
    # 此前仅经 langgraph-sdk/langsmith 传递存在，S8 裸 python3 事故证明必须显式声明。
    # 导入仍延迟到 connect() 工厂内，hermetic/非 mac 宿主不触发 socket 栈。
    "websockets>=14",
]

[project.scripts]
testpilot-ingest = "testpilot_workers.ingest:main"
testpilot-ingest-cases = "testpilot_workers.ingest_cases:main"
testpilot-extract-requirements = "testpilot_workers.ingest_requirements:main"
testpilot-generate-testpoints = "testpilot_workers.generate_testpoints:main"
testpilot-mine-oracles = "testpilot_workers.mine_oracles:main"
testpilot-dispatch-outbox = "testpilot_workers.dispatch_outbox:main"
testpilot-promote-fewshot = "testpilot_workers.promote_fewshot:main"
testpilot-build-relations = "testpilot_workers.build_relations:main"
testpilot-runner = "testpilot_workers.runner:main"
testpilot-eval = "testpilot_workers.eval_worker:main"
testpilot-badcase = "testpilot_workers.badcase_cli:main"
testpilot-impact = "testpilot_workers.impact_cli:main"
testpilot-export-cases = "testpilot_workers.export_cases:main"
testpilot-scan-automation = "testpilot_workers.scan_automation:main"
testpilot-scan-generated-swift = "testpilot_workers.scan_generated_swift:main"
testpilot-impact-rerun = "testpilot_workers.impact_rerun:main"
testpilot-lint-cases = "testpilot_workers.lint_cases:main"
testpilot-hybrid = "testpilot_workers.hybrid_cli:main"
testpilot-inject-xctestrun = "testpilot_workers.xctestrun_inject:main"
testpilot-ws-gate-driver = "testpilot_workers.ws_gate_driver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testpilot_workers"]
